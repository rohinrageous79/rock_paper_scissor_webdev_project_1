<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ROCK PAPER SCISSOR </title>
    <link rel="stylesheet" href="ppr4.css">
</head>
<body>
    <div class="base">
        <h1> ROCK PAPER SCISSORS </h1>
        <div class="buttons">
            <button id="rock">
            <img src="https://supersimple.dev/projects/rock-paper-scissors/images/rock-emoji.png">
            </button>
            <button id="paper">
            <img src="https://supersimple.dev/projects/rock-paper-scissors/images/paper-emoji.png">
            </button>
            <button id="scissor">
            <img src="https://supersimple.dev/projects/rock-paper-scissors/images/scissors-emoji.png">
            </button>
            <button id="reset">
                RESET
            </button>
        </div>
    </div>

    <p id="moves"> You: | Computer: </p>

    <div class="score">
        <p id="result"> let's play </p>
        <p id="user-score"> User: 0 </p> 
        <p id="computer-score"> Computer: 0 </p>
        
    </div>
</body>
<script src="pp4.js"></script>
</html>
